                  - /url: https://dr17.sdss.org/infrared/spectrum/view/stars
            - paragraph [ref=e555]:
              - text: The SAW permits some simple object searches as well as interactively plots their associated spectra. It can also be used to construct lists of spectra to be downloaded in bulk; see further instructions in
