[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrogyro-study"
version = "0.1.0"
description = "Reproducible tests of equation discovery for stellar rotation"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2", "scipy>=1.14", "sympy>=1.13", "matplotlib>=3.9", "pysr==2.7.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
report = ["reportlab>=4", "pypdf>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
