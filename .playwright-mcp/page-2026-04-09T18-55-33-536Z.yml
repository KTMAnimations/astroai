            - paragraph [ref=e520]:
              - text: APOGEE target information and derived radial velocities, stellar parameters, and elemental abundances are loaded into the Catalog Archive Server (CAS) database. CAS contains a number of ways of interfacing with the database, including SQL-based access through the
              - link "CasJobs" [ref=e521] [cursor=pointer]:
                - /url: http://skyserver.sdss.org/Casjobs/
              - text: portal that allows you to save and analyze all your search results.
            - paragraph [ref=e522]:
              - text: The
              - link "SkyServer Explore tool" [ref=e523] [cursor=pointer]:
                - /url: https://skyserver.sdss.org/public/VisualTools/explore/summary
              - text: provides a quick way to find APOGEE spectra for the desired object. The QuickLook pane shows an image and spectrum for each SDSS object. For objects with APOGEE spectra, the tool includes an APOGEE section. The APOGEE section of the Explore tool shows a composite spectrum, radial velocities, and derived stellar atmospheric parameters, while also providing links to additional data, including the spectrum as a FITS file.
            - paragraph [ref=e524]:
              - text: All APOGEE catalog data are available through the search tools of SkyServer. The
              - link "Infrared Spectroscopy Query Form" [ref=e525] [cursor=pointer]:
                - /url: http://skyserver.sdss.org/public/SearchTools/IRQS/
              - text: lets you search for APOGEE catalog objects by position, spectral classification, velocity, and other constraints from spectroscopic and/or photometric parameters.
              - link "SQL Search" [ref=e526] [cursor=pointer]:
                - /url: http://skyserver.sdss.org/public/SearchTools/SQL/
              - text: lets you create your own search using the SQL database programming language; see the
              - link "SkyServer SQL Tutorial" [ref=e527] [cursor=pointer]:
                - /url: https://skyserver.sdss.org/dr16/en/help/howto/search/searchhowtohome.aspx
              - text: to learn how to write SQL queries.
            - paragraph [ref=e528]:
              - text: We provide some use-cases for the CAS tools on
              - link "Examples" [ref=e529] [cursor=pointer]:
                - /url: /dr17/irspec/catalogs/#CAS
              - text: .
